<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YuZhFool · 音序</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
  min-height:100vh;
  background:#050505;
  background-image:radial-gradient(circle at 30% 20%, rgba(160,0,0,0.22), transparent 35%),
  radial-gradient(circle at 70% 80%, rgba(120,0,0,0.25), transparent 40%);
  color:#fff;
  display:flex;justify-content:center;align-items:center;padding:20px;
}
.wrap{
  width:750px;
  background:rgba(18,18,18,0.92);
  border:1px solid rgba(200,20,20,0.25);
  border-radius:28px;
  padding:40px;
  box-shadow:0 0 40px rgba(180,0,0,0.2);
  text-align:center;
}
h1{color:#ff4444;font-size:24px;letter-spacing:4px;margin-bottom:6px;}
.song-name{font-size:19px;color:#eee;margin:28px 0;min-height:26px;}
.disc-box{position:relative;width:260px;height:260px;margin:0 auto 28px;}
.disc{
  width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle,#111 0 24%,#2b0808 25% 30%,#141414 31% 60%,#222 61% 100%);
  box-shadow:0 0 0 3px rgba(220,30,30,0.4),0 15px 40px #000;
  animation: spin 12s linear infinite;
  animation-play-state:paused;
}
.disc.playing{animation-play-state:running;}
.disc::after{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:24px;height:24px;background:#b82222;border-radius:50%;box-shadow:0 0 10px #ff3333;
}
.ctrl{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:22px;}
.btn{
  width:54px;height:54px;border-radius:50%;border:none;
  background:#220707;color:#ff4444;font-size:19px;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,60,60,0.3);
}
.play{width:72px;height:72px;background:linear-gradient(135deg,#ff2222,#770000);color:#fff;font-size:24px;}
.mode-btn{width:auto;height:auto;padding:9px 16px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,40,40,0.25);}
.vol{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}
input[type="range"]{width:200px;accent-color:#ff3333;}
.line{width:100%;height:7px;background:#222;border-radius:99px;cursor:pointer;margin-bottom:8px}
.line-fill{height:100%;width:0;background:#ff3333;border-radius:99px}
.time-text{display:flex;justify-content:space-between;color:#888;font-size:13px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>YuZhFool · 音序</h1>
  <div class="song-name" id="songText">未播放</div>
  <div class="disc-box">
    <div class="disc" id="disc"></div>
  </div>
  <div class="ctrl">
    <button class="btn" id="prev">⏮</button>
    <button class="btn play" id="playBtn">▶</button>
    <button class="btn" id="next">⏭</button>
    <button class="btn mode-btn" id="modeBtn">顺序</button>
  </div>
  <div class="vol">
    <span>音量</span>
    <input type="range" id="volSlider" min="0" max="100" value="80">
  </div>
  <div class="line" id="timeLine">
    <div class="line-fill" id="timeFill"></div>
  </div>
  <div class="time-text">
    <span id="curTime">00:00</span>
    <span id="durTime">00:00</span>
  </div>
</div>

<audio id="audio" preload="metadata">
<script>
const songs = [
  {name:"01",src:"1.mp3"},
  {name:"02",src:"2.mp3"},
  {name:"03",src:"3.mp3"},
  {name:"04",src:"4.mp3"},
  {name:"05",src:"5.mp3"},
  {name:"06",src:"6.mp3"},
  {name:"07",src:"7.mp3"},
  {name:"08",src:"8.mp3"},
  {name:"09",src:"9.mp3"},
  {name:"10",src:"10.mp3"},
  {name:"11",src:"11.mp3"},
  {name:"12",src:"12.mp3"},
  {name:"13",src:"13.mp3"},
  {name:"14",src:"14.mp3"},
  {name:"15",src:"15.mp3"},
  {name:"16",src:"16.mp3"},
  {name:"17",src:"17.mp3"},
  {name:"18",src:"18.mp3"},
  {name:"19",src:"19.mp3"},
  {name:"20",src:"20.mp3"},
];
const audio = document.getElementById("audio");
const disc = document.getElementById("disc");
const songText = document.getElementById("songText");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const modeBtn = document.getElementById("modeBtn");
const volSlider = document.getElementById("volSlider");
const timeLine = document.getElementById("timeLine");
const timeFill = document.getElementById("timeFill");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");

let currentIndex = 0;
let mode = 0; //0顺序 1随机 2单曲
let isPlaying = false;

function fmt(s){
  if(isNaN(s)) return "00:00";
  let m = Math.floor(s/60).toString().padStart(2,"0");
  let sec = Math.floor(s%60).toString().padStart(2,"0");
  return m+":"+sec;
}

function playIdx(idx){
  currentIndex = idx;
  audio.src = songs[idx].src;
  songText.textContent = songs[idx].name;
  audio.play().then(()=>{
    isPlaying = true;
    updateUI();
  }).catch(e=>{
    songText.textContent = songs[idx].name + " 无法播放";
    console.log(e);
  })
}
function updateUI(){
  if(isPlaying){
    disc.classList.add("playing");
    playBtn.textContent = "⏸";
  }else{
    disc.classList.remove("playing");
    playBtn.textContent = "▶";
  }
}
function prevSong(){
  let i;
  if(mode===1) i = Math.floor(Math.random()*songs.length);
  else i = (currentIndex -1 + songs.length) % songs.length;
  playIdx(i);
}
function nextSong(){
  let i;
  if(mode===2) i = currentIndex;
  else if(mode===1) i = Math.floor(Math.random()*songs.length);
  else i = (currentIndex+1) % songs.length;
  playIdx(i);
}

playBtn.onclick = ()=>{
  if(!audio.src){playIdx(0);return;}
  if(audio.paused){audio.play();isPlaying=true;}
  else{audio.pause();isPlaying=false;}
  updateUI();
}
prevBtn.onclick = prevSong;
nextBtn.onclick = nextSong;
modeBtn.onclick = ()=>{
  mode = (mode+1)%3;
  const text = ["顺序","随机","单曲循环"];
  modeBtn.textContent = text[mode];
}
volSlider.oninput = ()=>audio.volume = volSlider.value/100;

audio.ontimeupdate = ()=>{
  if(!audio.duration) return;
  const p = audio.currentTime / audio.duration;
  timeFill.style.width = p*100+"%";
  curTime.textContent = fmt(audio.currentTime);
}
audio.onloadedmetadata = ()=>durTime.textContent = fmt(audio.duration);
audio.onended = nextSong;
timeLine.onclick = (e)=>{
  if(!audio.duration) return;
  const r = timeLine.getBoundingClientRect();
  const p = (e.clientX - r.left)/r.width;
  audio.currentTime = p * audio.duration;
}
</script>
</body>
</html>
